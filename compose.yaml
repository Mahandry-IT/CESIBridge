name: cesibridge

x-common: &common
  init: true
  shm_size: 1gb
  env_file: .env
  volumes:
    - cesi-data:/data

services:
  # Serveur MCP headless. En pratique lancé par le client MCP via `docker run -i` (voir README).
  mcp:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp
    image: cesibridge:latest
    stdin_open: true

  # Login manuel via noVNC : docker compose --profile login run --rm --service-ports login
  login:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: login
    image: cesibridge-login:latest
    profiles: [login]
    ports:
      # Uniquement en local : noVNC donne accès à la session CESI.
      - '127.0.0.1:6080:6080'

  # PostgreSQL pour la synchronisation de l'emploi du temps : docker compose up -d db
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    volumes:
      - cesi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      # Uniquement en local : le sync lancé sur l'hôte (navigateur visible) s'y connecte.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'

  # Synchronisation headless : docker compose --profile sync run --rm sync
  sync:
    <<: *common
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mcp
    image: cesibridge:latest
    entrypoint: ['node', 'scripts/sync.js']
    profiles: [sync]
    volumes:
      - cesi-data:/data
      # Clé du compte de service Google : ./secrets/google-sa.json (jamais dans l'image ni dans Git).
      - ./secrets:/run/secrets/cesibridge:ro
    environment:
      CESI_HEADLESS: 'true'
      # Vide (donc ignoré) tant que Google n'est pas configuré dans .env.
      GOOGLE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_CALENDAR_ID:+/run/secrets/cesibridge/google-sa.json}
      # Les variables CESI_FILIERE, CESI_NIVEAU, CESI_ANNEE et CESI_EXAM_REMINDER_DAYS viennent de .env.
      # Corrections des examens : dans le volume, comme la session et les téléchargements.
      CESI_EXAM_CORRECTIONS_FILE: /data/exam-corrections.json
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  cesi-data:
    name: cesibridge-data
  cesi-pg:
    name: cesibridge-pg
